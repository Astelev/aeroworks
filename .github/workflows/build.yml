name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify particle hook against mapped NeoForge bytecode
        run: python3 scripts/check_particle_hook.py

      - name: Verify Sable wind hooks and Lift Patch contract
        run: python3 scripts/check_wind_hooks.py

      - name: Verify atmosphere pressure and drag contracts
        run: python3 scripts/check_atmosphere_hooks.py

      - name: Verify Simple Clouds weather wind contracts
        run: python3 scripts/check_weather_wind_hooks.py

      - name: Verify mechanical failure contracts
        run: python3 scripts/check_failure_hooks.py

      - name: Test cloud fog shader with software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          python3 scripts/test_cloud_fog_shader.py
